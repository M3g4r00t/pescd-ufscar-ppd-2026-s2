<script>
const S=[]; // slides
function slide(sec,title,html,notes,init){S.push({sec,title,html,notes:notes||'',init})}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// realce de sintaxe mínimo para C/CUDA
function hl(src){
  let t=esc(src);
  const stash=[];const enc=n=>String(n).replace(/\d/g,d=>String.fromCharCode(97+ +d));const dec=s=>s.replace(/[a-j]/g,c=>c.charCodeAt(0)-97);
  const keep=(cls,m)=>{stash.push(`<span class="${cls}">${m}</span>`);return `\u0000${enc(stash.length-1)}\u0000`};
  t=t.replace(/(\/\/[^\n]*)/g,(m)=>keep('c',m));
  t=t.replace(/(&quot;|")(?:(?!\1).)*\1/g,(m)=>keep('s',m));
  t=t.replace(/\b(__global__|__device__|__host__|for|if|return|void|int|float|size_t|const|dim3|cudaError_t|cudaStream_t|struct)\b/g,'<span class="k">$1</span>');
  t=t.replace(/\b(threadIdx|blockIdx|blockDim|gridDim|cudaMallocManaged|cudaMalloc|cudaMallocHost|cudaFree|cudaFreeHost|cudaMemcpyAsync|cudaMemcpy|cudaMemPrefetchAsync|cudaDeviceSynchronize|cudaStreamSynchronize|cudaStreamCreate|cudaStreamDestroy|cudaGetLastError|cudaGetErrorString|cudaGetDevice|cudaGetDeviceProperties|cudaDeviceGetAttribute|cudaCpuDeviceId)\b/g,'<span class="t">$1</span>');
  t=t.replace(/\b(\d+)\b/g,'<span class="n">$1</span>');
  return t.replace(/\u0000([a-j]+)\u0000/g,(_,i)=>stash[dec(i)]);
}
const code=(src)=>`<pre>${hl(src.replace(/^\n/,''))}</pre>`;
const sh=(src)=>`<pre>${esc(src.replace(/^\n/,''))}</pre>`;

/* ================== 0. ABERTURA ================== */
slide('Abertura','CUDA em prática',`
<div class="sec">Notebooks 1, 2 e 3</div>
<h1>Kernels, Unified Memory e Streams</h1>
<p class="lead">Roteiro de apoio: do primeiro kernel ao perfil visual com Nsight Systems. GPU de referência: <b>Tesla T4 (sm_75)</b> no Google Colab.</p>
<div class="grid g3">
 <div class="card"><h3>Bloco 1 · Notebook 1</h3><ul><li>Computação acelerada</li><li>Kernel e configuração de execução</li><li>Hierarquia de threads</li><li>Grid-stride loop</li><li>Tratamento de erros</li></ul></div>
 <div class="card"><h3>Bloco 2 · Notebook 2</h3><ul><li><code>cudaMallocManaged</code></li><li>Page faults e migração</li><li>Nsight Systems (<code>nsys</code>)</li><li>Prefetch</li></ul></div>
 <div class="card"><h3>Bloco 3 · Notebook 3</h3><ul><li>Stream padrão x não padrão</li><li>Pinned memory</li><li><code>cudaMemcpyAsync</code></li><li>Perfil visual e sobreposição</li></ul></div>
</div>
<div class="card warn" style="margin-top:16px"><b>Regra da aula:</b> toda afirmação de desempenho vem com GPU, tamanho, aquecimento e método. Os gráficos desta apresentação são <b>ilustrativos</b> quando assim rotulados.</div>`,
`Apresente o roteiro e a regra de medição. Os números dos notebooks vêm de uma T4 no Colab; não os apresente como benchmark geral. Pergunte quem já usou GPU para algo além de jogos.`);

slide('Abertura','Mapa da aula e fontes',`
<table>
<tr><th>Tema</th><th>Fonte principal</th><th>Idioma</th></tr>
<tr><td>Modelo CUDA, kernels, thread hierarchy</td><td>CUDA C++ Programming Guide (seções 2.1, 2.3)</td><td>EN</td></tr>
<tr><td>Primeiro kernel, grid-stride, prefetch</td><td>M. Harris, <i>An Even Easier Introduction to CUDA</i> (2025)</td><td>EN</td></tr>
<tr><td>Kernel e indexação em português</td><td>Insper, <i>Introdução a GPU</i> (SuperComputação 2026/2)</td><td>PT</td></tr>
<tr><td>Warps, blocos, <code>-arch</code></td><td>llmdeepdive, <i>O modelo de programação CUDA</i></td><td>PT</td></tr>
<tr><td>Unified Memory</td><td>M. Harris, <i>Unified Memory for CUDA Beginners</i> (2017)</td><td>EN</td></tr>
<tr><td>Streams e sobreposição</td><td>M. Harris, <i>How to Overlap Data Transfers in CUDA C/C++</i> (2012)</td><td>EN</td></tr>
<tr><td>Saída do <code>nsys --stats</code></td><td>Nsight Systems User Guide; tutorial MolSSI</td><td>EN</td></tr>
</table>
<p class="src">Links completos e lacunas em <code>classes/apoio/hub_cuda_aula.md</code>. Sem fonte em PT aberta e verificada para unified memory, nsys, streams e erros.</p>`,
`Diga explicitamente aos alunos quais fontes estão em inglês. Os posts de Harris de 2012 e 2017 usam GPUs antigas e nvprof; usamos o raciocínio, não os números.`);

/* ================== 1. COMPUTAÇÃO ACELERADA ================== */
slide('1 · Computação acelerada','CPU x GPU: por que acelerar',`
<p class="lead">A CPU é otimizada para latência de poucas threads. A GPU é otimizada para vazão de milhares de threads que fazem a mesma operação em dados diferentes.</p>
<div class="grid g2">
<div class="card"><svg viewBox="0 0 420 230" width="100%" id="svgArch"></svg><p class="src">Esquema ilustrativo, sem escala. Não representa uma CPU ou GPU específica.</p></div>
<div>
 <div class="card"><h3>Quando vale a pena</h3><ul><li>Muito dado, mesma operação (data parallelism)</li><li>Operações independentes entre elementos</li><li>Intensidade aritmética suficiente para amortizar a transferência</li></ul></div>
 <div class="card warn" style="margin-top:12px"><h3>Cuidado</h3><p>Somar dois vetores faz pouca conta por byte movido. O gargalo tende a ser memória ou transferência, e não a aritmética (Insper, <i>Por que a soma pode não acelerar</i>).</p></div>
</div></div>
<h3 style="margin-top:14px">Checagem do ambiente (Colab)</h3>
${sh(`!nvidia-smi          # GPU, driver, memória
!nvcc --version      # versão do toolkit
# Colab: Runtime > Change runtime type > T4 GPU`)}`,
`Mostre nvidia-smi: nome (Tesla T4), memória (~15 GB) e versão do driver. Lembre que 'CUDA Version' no nvidia-smi é a versão máxima suportada pelo driver, e não o toolkit instalado; o toolkit vem de nvcc --version.`,
()=>{const s=document.getElementById('svgArch');let h='';
 h+='<text x="10" y="18" fill="#9aa3b2" font-size="13">CPU: poucos núcleos fortes</text>';
 for(let i=0;i<4;i++)h+=`<rect x="${12+i*48}" y="26" width="42" height="54" rx="4" fill="#4c9aff"/>`;
 h+='<rect x="12" y="86" width="186" height="14" rx="3" fill="#2c313c"/><text x="16" y="97" fill="#9aa3b2" font-size="10">cache grande</text>';
 h+='<text x="10" y="132" fill="#9aa3b2" font-size="13">GPU: muitos núcleos simples</text>';
 for(let r=0;r<5;r++)for(let c=0;c<24;c++)h+=`<rect x="${12+c*16.3}" y="${142+r*14}" width="12" height="10" rx="2" fill="#76b900"/>`;
 h+='<text x="10" y="224" fill="#9aa3b2" font-size="10">cada quadrado = unidade de execução (ilustrativo)</text>';
 s.innerHTML=h;});

slide('1 · Computação acelerada','Fluxo básico de um programa CUDA',`
<div class="grid g2">
<div class="card"><svg viewBox="0 0 440 250" width="100%" id="svgFlow"></svg></div>
<div>
${code(`// 1) Memória acessível à GPU
float *a;
cudaMallocManaged(&a, N * sizeof(float));

// 2) Inicializar na CPU
for (int i = 0; i < N; ++i) a[i] = i;

// 3) Lançar kernel (assíncrono!)
doubleElements<<<blocos, threads>>>(a, N);

// 4) Esperar a GPU antes de ler na CPU
cudaDeviceSynchronize();

// 5) Liberar
cudaFree(a);`)}
<p class="src">Padrão usado nos notebooks 1 e 2; mesma estrutura em Harris (2025).</p>
</div></div>`,
`Enfatize o passo 3 como assíncrono: o controle volta para a CPU antes do kernel terminar. Sem o passo 4, a CPU pode ler dados incompletos.`,
()=>{const s=document.getElementById('svgFlow');
 const bx=[['Host (CPU)',20,20,'#4c9aff'],['Device (GPU)',250,20,'#76b900']];
 let h='';bx.forEach(b=>h+=`<rect x="${b[1]}" y="${b[2]}" width="170" height="210" rx="8" fill="none" stroke="${b[3]}" stroke-width="2"/><text x="${b[1]+10}" y="${b[2]+20}" fill="${b[3]}" font-size="13">${b[0]}</text>`);
 const st=[['alocar',58],['inicializar',98],['lançar kernel',138],['sincronizar',178]];
 st.forEach(([t,y])=>h+=`<rect x="34" y="${y}" width="140" height="28" rx="5" fill="#20242d" stroke="#2c313c"/><text x="44" y="${y+19}" fill="#e8eaf0" font-size="12">${t}</text>`);
 h+='<rect x="264" y="138" width="140" height="28" rx="5" fill="#20242d" stroke="#76b900"/><text x="274" y="157" fill="#e8eaf0" font-size="12">kernel executa</text>';
 h+='<path d="M174 152 H264" stroke="#ffb84d" stroke-width="2" marker-end="url(#ar)"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#ffb84d"/></marker></defs>';
 h+='<text x="180" y="140" fill="#ffb84d" font-size="10">retorna já</text>';
 s.innerHTML=h;});

/* ================== 2. KERNEL ================== */
slide('2 · Kernel','Kernel, host e device',`
<div class="grid g2">
<div>
${code(`// Roda na GPU, chamada pela CPU
__global__ void helloGPU()
{
  printf("Olá da GPU\\n");
}

void helloCPU()   // função normal
{
  printf("Olá da CPU\\n");
}

int main()
{
  helloCPU();
  helloGPU<<<1, 1>>>();   // 1 bloco, 1 thread
  cudaDeviceSynchronize();
}`)}
${sh(`nvcc -arch=sm_75 -o hello-gpu hello-gpu.cu -run`)}
</div>
<div>
<div class="card"><h3>Qualificadores</h3>
<table><tr><th>Qualificador</th><th>Roda em</th><th>Chamado de</th></tr>
<tr><td><code>__global__</code></td><td>device</td><td>host</td></tr>
<tr><td><code>__device__</code></td><td>device</td><td>device</td></tr>
<tr><td><code>__host__</code></td><td>host</td><td>host</td></tr></table></div>
<div class="card" style="margin-top:12px"><h3>Regras do kernel</h3><ul><li>Retorna <code>void</code></li><li>O lançamento é <b>assíncrono</b></li><li><code>.cu</code> é compilado pelo <code>nvcc</code></li></ul></div>
<div class="card err" style="margin-top:12px"><b>Erro comum (notebook 1, vector-add):</b> usar <code>&lt;&lt;&lt;…&gt;&gt;&gt;</code> numa função sem <code>__global__</code> gera “a host function call cannot be configured”.</div>
</div></div>`,
`Peça aos alunos para prever a saída de helloGPU<<<1,1>>> sem cudaDeviceSynchronize: o printf do device pode nunca aparecer, porque o programa termina antes do buffer ser descarregado. Fonte: Programming Guide 2.1; Insper.`);

slide('2 · Kernel','Configuração de execução <<<blocos, threads>>>',`
<div class="grid g2">
<div>
<div class="formula">kernel&lt;&lt;&lt; <b>numBlocks</b>, <b>threadsPerBlock</b> &gt;&gt;&gt;(args)</div>
<div class="formula">threads totais = numBlocks × threadsPerBlock</div>
<ul><li><b>1º argumento:</b> blocos no grid</li><li><b>2º argumento:</b> threads por bloco (máx. 1024)</li><li>Há um 3º (memória compartilhada dinâmica) e um 4º (stream), vistos adiante</li></ul>
<div class="ctl"><label>blocos <input type="number" id="cfgB" value="2" min="1" max="64"></label><label>threads/bloco <input type="number" id="cfgT" value="4" min="1" max="2048"></label><button class="btn" id="cfgGo">Visualizar</button></div>
<div class="out" id="cfgOut"></div>
</div>
<div class="card"><div id="cfgViz"></div></div>
</div>
<div class="card err" style="margin-top:12px"><b>Notebook 1, 06-errors:</b> <code>threads_per_block = 2048</code> excede 1024 e o lançamento falha com <code>invalid argument</code>. O kernel não chega a executar.</div>`,
`Use o widget: tente 2 e 2048 para disparar o aviso. O erro só aparece em cudaGetLastError, não é uma exceção.`,
()=>{const run=()=>{const B=+cfgB.value,T=+cfgT.value;let ok=T<=1024&&T>=1&&B>=1;
 cfgOut.textContent=ok?`threads totais = ${B} × ${T} = ${B*T}\nwarps por bloco = ceil(${T}/32) = ${Math.ceil(T/32)}${T%32?'\naviso: T não é múltiplo de 32; o último warp fica incompleto':''}`:`INVÁLIDO: ${T>1024?'máximo de 1024 threads por bloco':'valores devem ser >= 1'}\ncudaGetLastError() -> invalid configuration argument`;
 let h='';if(ok)for(let b=0;b<Math.min(B,8);b++){h+=`<div style="margin:4px 0"><small class="src">bloco ${b}</small><div class="cells">`;for(let t=0;t<Math.min(T,32);t++)h+=`<div class="cell a">${t}</div>`;if(T>32)h+=`<div class="cell">…</div>`;h+='</div></div>'}
 cfgViz.innerHTML=h||'<p class="src">configuração inválida</p>'};
 cfgGo.onclick=run;run();});

/* ================== 3. THREAD HIERARCHY ================== */
slide('3 · Hierarquia de threads','Grid → bloco → thread',`
<div class="grid g2">
<div class="card"><svg viewBox="0 0 440 240" width="100%" id="svgHier"></svg></div>
<div>
<table><tr><th>Variável</th><th>Significado</th></tr>
<tr><td><code>threadIdx.x</code></td><td>posição da thread no bloco</td></tr>
<tr><td><code>blockIdx.x</code></td><td>posição do bloco no grid</td></tr>
<tr><td><code>blockDim.x</code></td><td>threads por bloco</td></tr>
<tr><td><code>gridDim.x</code></td><td>blocos no grid</td></tr></table>
<div class="formula">i = blockIdx.x × blockDim.x + threadIdx.x</div>
${code(`__global__ void initializeElementsTo(int v, int *a, int N)
{
  int i = blockIdx.x * blockDim.x + threadIdx.x;
  if (i < N)          // guarda: o grid costuma ser maior que N
    a[i] = v;
}`)}
<p class="src">Mesma fórmula em Harris (2025) e em Insper. Blocos de uma grade 1D: <code>.y</code> e <code>.z</code> valem 0.</p>
</div></div>`,
`A guarda if (i<N) é o primeiro bug que os alunos encontram. Ligue ao slide seguinte, em que calculamos o número de blocos arredondando para cima.`,
()=>{const s=document.getElementById('svgHier');let h='<rect x="6" y="6" width="428" height="228" rx="8" fill="none" stroke="#4c9aff" stroke-width="2"/><text x="14" y="24" fill="#4c9aff" font-size="12">Grid (gridDim.x = 3)</text>';
 for(let b=0;b<3;b++){const x=18+b*138;h+=`<rect x="${x}" y="38" width="128" height="180" rx="6" fill="#181b22" stroke="#76b900" stroke-width="1.5"/><text x="${x+8}" y="56" fill="#76b900" font-size="11">bloco ${b} (blockIdx.x=${b})</text>`;

slide('3 · Hierarquia de threads','Grid-stride loop',`
<p class="lead">Quando N é maior que o número de threads, cada thread processa vários elementos, avançando um passo igual ao total de threads do grid.</p>
<div class="grid g2">
<div>
${code(`__global__ void doubleElements(int *a, int N)
{
  int idx    = blockIdx.x * blockDim.x + threadIdx.x;
  int stride = gridDim.x  * blockDim.x;   // total de threads

  for (int i = idx; i < N; i += stride)
    a[i] *= 2;
}`)}

<div class="card err"><b>Notebook 1, 06-errors/01:</b> <code>i &lt; N + stride</code> acessa além do array.</div>

slide('5 · Erros','Tratamento de erros em CUDA',`
<div class="grid g2">
<div>
${code(`inline cudaError_t checkCuda(cudaError_t result)
{
  if (result != cudaSuccess) {
    fprintf(stderr, "CUDA Runtime Error: %s\\n",
            cudaGetErrorString(result));
  }
  return result;
}

// uso
checkCuda( cudaMallocManaged(&a, size) );

kernel<<<blocos, threads>>>(a, N);
checkCuda( cudaGetLastError() );        // erro de lançamento
checkCuda( cudaDeviceSynchronize() );   // erro durante a execução`)}
</div>
<div>
<div class="card"><h3>Dois tipos de erro</h3><ul><li><b>Lançamento síncrono:</b> configuração inválida (ex.: 2048 threads). Detectado por <code>cudaGetLastError()</code>.</li><li><b>Execução assíncrona:</b> falha dentro do kernel. Só aparece na próxima sincronização.</li></ul></div>
<div class="card warn" style="margin-top:12px">Um kernel não retorna valor. Sem verificar, o programa continua e produz resultado errado em silêncio.</div>
<div class="card ok" style="margin-top:12px">Ferramenta extra: <code>compute-sanitizer ./programa</code> (citada na aula 12.3 do llmdeepdive) ajuda a achar acessos fora do limite.</div>
</div></div>`,

slide('6 · Unified Memory','Um espaço de endereços para CPU e GPU',`
<div class="grid g2">
<div>
${code(`// Antes: duas alocações e cópias explícitas
float *h = (float*)malloc(size);
float *d; cudaMalloc(&d, size);
cudaMemcpy(d, h, size, cudaMemcpyHostToDevice);

// Unified Memory: um ponteiro, os dois lados acessam
float *a;
cudaMallocManaged(&a, size);`)}
<ul><li>Retorna um ponteiro válido na CPU e na GPU.</li><li>O sistema migra páginas sob demanda.</li><li>A migração custa tempo e aparece no perfil.</li></ul>
</div>
<div class="card"><h3>Pascal e posteriores</h3><p>Harris (2017): em GPUs Pascal ou mais novas, a memória gerenciada pode não estar fisicamente alocada quando <code>cudaMallocManaged</code> retorna. As páginas são criadas ao serem acessadas, e a GPU resolve page faults com o <i>Page Migration Engine</i>.</p>
<p>A T4 (Turing, sm_75) é posterior à Pascal e suporta esse modelo.</p>
<p class="src">Em GPUs pré-Pascal (Kepler/Maxwell), o runtime migra tudo antes de cada kernel.</p></div>
</div>`,

  kernel<<<blocos, threads, 0, s[i]>>>(&d_a[off], chunk);
  cudaMemcpyAsync(&h_a[off], &d_a[off], chunkBytes,
                  cudaMemcpyDeviceToHost, s[i]);
}
cudaDeviceSynchronize();
cudaFreeHost(h_a);`)}
<p class="src">Estrutura baseada em Harris (2012), escrita a partir da assinatura do Runtime API. O trecho “V2” do post tem um argumento duplicado e não foi copiado.</p>
</div>
<div>
<div class="card"><h3>Três requisitos para sobrepor cópia e kernel</h3><ol><li>Dispositivo com “concurrent copy and execution” (<code>cudaDeviceProp</code>)</li><li>Cópia e kernel em <b>streams diferentes, não padrão</b></li><li>Memória do host <b>pinned</b></li></ol></div>
<div class="card warn" style="margin-top:12px">Cuidado: <code>cudaMemcpyAsync</code> com memória pageable (<code>malloc</code>) pode perder a assincronia. O quinto argumento é o stream.</div>
<div class="card" style="margin-top:12px"><b>Sincronização mais fina:</b> <code>cudaStreamSynchronize(s)</code> espera um stream; <code>cudaDeviceSynchronize()</code> espera o dispositivo todo e, segundo Harris, pode prejudicar o desempenho quando usada sem necessidade.</div>
</div></div>`,
`No notebook 3, o foco é perfil visual: abra o relatório no Nsight Systems e identifique a linha de CUDA HW com Memory e Kernels. Pergunte se há sobreposição ou não.`);

function go(i){cur=Math.max(0,Math.min(S.length-1,i));S.forEach((s,k)=>s.el.classList.toggle('on',k===cur));const s=S[cur];
 if(!s.done&&s.init){s.init();s.done=true}

 notes.innerHTML=`<h4>Notas do professor</h4><div>${s.notes||'—'}</div>`;location.hash='#'+(cur+1);}

 const k=e.key;if(k==='ArrowRight'||k==='PageDown'||k===' ')go(cur+1);else if(k==='ArrowLeft'||k==='PageUp')go(cur-1);
 else if(k==='Home')go(0);else if(k==='End')go(S.length-1);else if(k==='t'||k==='T')toc.classList.toggle('on');
 else if(k==='n'||k==='N')notes.classList.toggle('on');else if(k==='l'||k==='L')document.body.classList.toggle('light');
 else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
 else if(k==='p'||k==='P')window.print();});
